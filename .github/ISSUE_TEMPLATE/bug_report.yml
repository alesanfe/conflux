name: Bug report
description: Algo no funciona como debería
labels: [bug]
body:
  - type: input
    id: version
    attributes:
      label: Versión / commit
      placeholder: git rev-parse HEAD
    validations: {required: true}
  - type: textarea
    id: expected
    attributes:
      label: Comportamiento esperado
    validations: {required: true}
  - type: textarea
    id: actual
    attributes:
      label: Comportamiento obtenido
    validations: {required: true}
  - type: textarea
    id: repro
    attributes:
      label: Reproducción mínima
      description: Config, entrada y pasos exactos — el caso más pequeño que falla
      placeholder: |
        1. config.json: {...}
        2. curl 'http://127.0.0.1:9700/...'
        3. resultado: ...
    validations: {required: true}
  - type: textarea
    id: logs
    attributes:
      label: Logs relevantes
      description: eventos JSON del log (las keys ya salen enmascaradas)
      render: shell
  - type: textarea
    id: test
    attributes:
      label: Test que falla (si lo tienes)
      description: Failing-first — un test que reproduzca el defecto acelera mucho el fix
      render: python
