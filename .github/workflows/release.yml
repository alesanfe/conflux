name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7
        with:
          python-version: '3.12'
      - run: pip install build
      - run: python -m build
      - uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be  # v2
        with:
          subject-path: dist/*
      - uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3  # v3
        with:
          files: dist/*
          generate_release_notes: true

  exe:
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: windows-latest, asset: conflux.exe, flags: '--noconsole'}
          - {os: ubuntu-latest, asset: conflux-linux, flags: ''}
          - {os: macos-latest, asset: conflux-macos, flags: ''}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7
        with:
          python-version: '3.12'
      - run: pip install -r requirements.in pyinstaller==6.22.3
      - run: pyinstaller --onefile ${{ matrix.flags }} --name conflux --paths src --clean proxy.py
      - name: renombra el artefacto por plataforma
        shell: bash
        run: |
          # windows ya sale como conflux.exe; posix sale como 'conflux'
          [ -f dist/conflux ] && mv dist/conflux "dist/${{ matrix.asset }}" || true
          ls -l dist/
      - uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be  # v2
        with:
          subject-path: dist/${{ matrix.asset }}
      - uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3  # v3
        with:
          files: dist/${{ matrix.asset }}
