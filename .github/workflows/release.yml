name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install build
      - run: python -m build
      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: dist/*
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
