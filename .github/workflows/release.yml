name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: pip install build
      - run: python -m build
      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: dist/*
      - uses: softprops/action-gh-release@v3
        with:
          files: dist/*
          generate_release_notes: true

  exe:
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: windows-latest, asset: conflux.exe, flags: '--noconsole'}
          - {os: ubuntu-latest, asset: conflux-linux, flags: ''}
          - {os: macos-latest, asset: conflux-macos, flags: ''}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: pip install -r requirements.in pyinstaller==6.22.3
      - run: pyinstaller --onefile ${{ matrix.flags }} --name conflux --paths src --clean proxy.py
      - name: renombra el artefacto por plataforma
        shell: bash
        run: |
          src=dist/conflux
          [ -f "$src.exe" ] && src=$src.exe
          mv "$src" "dist/${{ matrix.asset }}"
      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: dist/${{ matrix.asset }}
      - uses: softprops/action-gh-release@v3
        with:
          files: dist/${{ matrix.asset }}
