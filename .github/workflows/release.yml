name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: pip install build
      - run: python -m build
      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: dist/*
      - uses: softprops/action-gh-release@v3
        with:
          files: dist/*
          generate_release_notes: true

  exe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt pyinstaller==6.22.3
      - run: pyinstaller --onefile --noconsole --name conflux --paths src --clean proxy.py
      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: dist/conflux.exe
      - uses: softprops/action-gh-release@v3
        with:
          files: dist/conflux.exe
