name: soak
# Estabilidad sostenida: levanta el proxy real y lo machaca ~45 min con
# tráfico mixto. Presupuestos: 0 errores/5xx, p95 <15s, sin fugas de
# threads/RSS, health/ready sano al final. El modo --light concentra la
# carga en el pipeline local (los collects de /stream pegan a ~30
# upstreams reales; con --light son ~1/12 del tráfico).
on:
  workflow_dispatch:
    inputs:
      minutes:
        description: 'duración del soak en minutos (GitHub cap ~330)'
        required: false
        default: '45'
  schedule:
    - cron: '0 4 * * 0'         # semanal: domingo 04:00 UTC (45min)
    - cron: '0 3 1 * *'         # mensual: día 1 a las 03:00 UTC (4h, cap 6h)

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

jobs:
  soak:
    runs-on: ubuntu-latest
    timeout-minutes: 320   # dentro del cap de 6h de runners GitHub-hosted
    env:
      # mensual programado -> 240min; dispatch -> input; semanal -> 45
      SOAK_MIN: ${{ github.event_name == 'schedule' && (github.event.schedule == '0 3 1 * *' && '240' || '45') || github.event.inputs.minutes || '45' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - name: levantar proxy
        run: |
          python proxy.py > soak-srv.log 2>&1 &
          echo $! > srv.pid
          for _ in $(seq 1 30); do
            if curl -sf http://127.0.0.1:9700/health/live > /dev/null; then break; fi
            sleep 1
          done
          curl -sf http://127.0.0.1:9700/health/live > /dev/null
      - name: soak ${{ env.SOAK_MIN }}min x6 workers (light)
        # cap 6GB: el pico RSS bajo 6 workers ronda ~4GB por churn de
        # buffers (Python no devuelve arenas); el cap sigue cazando un
        # crecimiento desbocado real.
        env:
          CONFLUX_SOAK_RSS_CAP: '6144'
        run: python scripts/soak.py "$SOAK_MIN" 6 --light | tee soak-report.txt
      - name: postmortem si falla
        if: failure()
        run: tail -200 soak-srv.log
      - uses: actions/upload-artifact@bbbca2ddaa9fe9aa640b1b0b1e7b37e1cc3e31de  # v7
        if: always()
        with:
          name: soak-report
          path: |
            soak-report.txt
            soak-srv.log
          retention-days: 90
