name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: ruff check src tests scripts
      - run: pylint src/conflux --reports=n --fail-under=9.5
      - run: xenon --max-absolute B --max-modules B --max-average A src/conflux
      - run: mypy
      - run: bandit -r src/conflux -ll -q

  security:
    runs-on: ubuntu-latest
    permissions:
      id-token: write      # attestation keyless signing
      attestations: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: pip-audit -r requirements.txt
      - run: detect-secrets scan --all-files --exclude-files 'requirements.txt' | python3 -c "import json,sys; r=json.load(sys.stdin)['results']; assert not r, r"
      - run: cyclonedx-py requirements requirements.txt -o sbom.json
      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: sbom.json
      - uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: sbom.json

  dependency-review:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/dependency-review-action@v4

  test:
    strategy:
      matrix:
        os: [ubuntu-latest]
        python-version: ['3.11', '3.12', '3.13']
        include:
          - os: macos-latest
            python-version: '3.13'
          - os: windows-latest
            python-version: '3.13'
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -r requirements-dev.txt
      # toda la suite es hermética: la e2e replaya fixtures VCR grabados
      # (live con CONFLUX_E2E_LIVE=1 / scripts/record_e2e.py regenera)
      - run: coverage run -m unittest discover -s tests -t .
      - run: coverage report --include='src/*' --fail-under=80

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build .
