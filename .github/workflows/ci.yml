name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt && pip install -r requirements-dev.txt
      - run: ruff check src tests scripts
      - run: pylint src/conflux --reports=n --fail-under=9.5
      - run: xenon --max-absolute D --max-modules C --max-average B src/conflux
      - run: mypy
      - run: bandit -r src/conflux -ll -q

  security:
    runs-on: ubuntu-latest
    permissions:
      id-token: write      # attestation keyless signing
      attestations: write
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt && pip install -r requirements-dev.txt
      - run: pip-audit -r requirements.txt
      - run: detect-secrets scan --all-files --exclude-files 'requirements.txt' --baseline .secrets.baseline | python3 -c "import json,sys; t=sys.stdin.read().strip(); r=json.loads(t)['results'] if t else {}; assert not r, r"
      - run: cyclonedx-py requirements requirements.txt -o sbom.json
      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: sbom.json
      - uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: sbom.json

  dependency-review:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/dependency-review-action@v5

  test:
    strategy:
      matrix:
        os: [ubuntu-latest]
        python-version: ['3.11', '3.12', '3.13']
        include:
          - os: macos-latest
            python-version: '3.13'
          - os: windows-latest
            python-version: '3.13'
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -r requirements.txt && pip install -r requirements-dev.txt
      # toda la suite es hermética: la e2e replaya fixtures VCR grabados
      # (live con CONFLUX_E2E_LIVE=1 / scripts/record_e2e.py regenera)
      - run: coverage run scripts/test_times.py --nomem --junit junit.xml --history history.jsonl
      - run: coverage report --include='src/*' --fail-under=80
      - name: artefactos de test (junit + historial de tiempos)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-report-${{ matrix.os }}-py${{ matrix.python-version }}
          path: |
            junit.xml
            history.jsonl
          if-no-files-found: ignore
      - name: resumen de tiempos
        if: always()
        shell: bash
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json, pathlib
          p = pathlib.Path('history.jsonl')
          rows = [json.loads(x) for x in p.read_text().splitlines()
                  if x.strip()] if p.exists() else []
          if rows:
              r = rows[-1]
              print('### Test times')
              print(f"{r['tests']} tests en {r['total']:.1f}s — "
                    f"p50 {r['p50']*1000:.0f}ms p95 {r['p95']:.2f}s "
                    f"p99 {r['p99']:.2f}s · fallos {r['failed']}")
              top = sorted(r.get('per_test', {}).items(),
                           key=lambda kv: -kv[1])[:5]
              print('')
              for tid, secs in top:
                  print(f"- `{secs:.2f}s` {tid.split('.')[-1]}")
          PY

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: docker build .
