name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: ruff check src tests
      - run: pylint src/conflux --reports=n --fail-under=9.5
      - run: xenon --max-absolute B --max-modules B --max-average A src/conflux
      - run: mypy
      - run: bandit -r src/conflux -ll -q

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: pip-audit -r requirements.txt
      - run: detect-secrets scan --all-files --exclude-files 'requirements.txt' | python3 -c "import json,sys; r=json.load(sys.stdin)['results']; assert not r, r"
      - run: cyclonedx-py requirements requirements.txt -o sbom.json
      - uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: sbom.json

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -r requirements-dev.txt
      # suites herméticas (sin red): la e2e se salta sola con CI=true —
      # verifica upstreams reales, se corre local con scripts/check.sh
      - run: coverage run -m unittest discover -s tests -t .
      - run: coverage report --include='src/*' --fail-under=80
