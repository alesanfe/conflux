name: live
# Canary contra upstreams REALES — el CI normal replaya fixtures VCR
# herméticos; este job pega a internet de verdad y avisa si un upstream
# cambia de contrato (drift que los fixtures no pueden ver).
# Además guarda un snapshot /health por fuente como artefacto: la
# varianza de proveedores queda MEDIDA en el tiempo, no supuesta.
on:
  workflow_dispatch:            # bajo demanda
  schedule:
    - cron: '0 6 * * 1,3,5'     # lun/mié/vie 06:00 UTC

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

jobs:
  e2e-real:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt && pip install -r requirements-dev.txt
      - run: python -m unittest tests.e2e -v
        env:
          CONFLUX_E2E_LIVE: '1'
      - name: canary /health por fuente (serie temporal)
        if: always()
        run: |
          python proxy.py > canary-srv.log 2>&1 &
          echo $! > srv.pid
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:9700/health/live >/dev/null && break || sleep 1
          done
          sleep 5   # deja que el refresco de fuentes aterrice
          curl -s http://127.0.0.1:9700/health | python -c "
          import json, sys, time
          d = json.load(sys.stdin)
          print(json.dumps({'ts': time.strftime('%Y-%m-%dT%H:%M:%SZ',
                time.gmtime()), 'sources': d}, indent=1))
          " > canary-health.json || echo '{"error":"health no respondio"}' > canary-health.json
          kill $(cat srv.pid) 2>/dev/null || true
      - uses: actions/upload-artifact@bbbca2ddaa9fe9aa640b1b0b1e7b37e1cc3e31de  # v7
        if: always()
        with:
          name: live-canary-${{ github.run_number }}
          path: |
            canary-health.json
            canary-srv.log
          retention-days: 90
