name: dependabot-automerge
# Auto-merge SOLO para bumps de github_actions (los workflows se auto-
# validan en la propia corrida del PR). Los bumps pip NO: el bot no
# sincroniza requirements.txt (lock con hashes) — quedan desincronizados
# como pasó en PR#6; hay que hacerlo a mano.
on: pull_request

permissions:
  contents: write
  pull-requests: write

jobs:
  automerge:
    runs-on: ubuntu-latest
    # user.login no es falsificable por nombre de rama (github.actor sí):
    # zizmor bot-conditions. Doble cierre: autor + prefijo dependabot/actions.
    if: github.event.pull_request.user.login == 'dependabot[bot]' &&
        startsWith(github.event.pull_request.head.ref, 'dependabot/github_actions/')
    steps:
      - run: gh pr merge --auto --squash "$PR_URL"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
