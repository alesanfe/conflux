[build-system]
requires = ["setuptools>=84.2.1"]
build-backend = "setuptools.build_meta"

[project]
name = "conflux"
version = "1.0.0"
description = "Proxy local que unifica streams, catálogos, metas y calendario de addons Stremio"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "requests>=2.34.2,<3",
    "defusedxml>=0.7.1",
]

[project.optional-dependencies]
dev = [
    "pylint>=4",
    "ruff>=0.14",
    "radon>=6",
    "xenon>=0.9",
    "bandit>=1.9",
    "vulture>=2",
    "refurb>=2",
    "mypy>=1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
src = ["src", "tests"]

[tool.ruff.lint]
# El codigo se escribio contra ruff 0.14 (pre-commit v0.14.0): defaults
# E4/E7/E9/F. Sin select explicito, ruff >=0.15 amplia las reglas por
# defecto y marca ~160 avisos preexistentes — el select lo hace
# determinista entre versiones.
select = ["E4", "E7", "E9", "F"]
# Estilo compacto deliberado del repo: `import a, b` y `x; y` en una linea.
ignore = ["E401", "E702"]

[tool.ruff.lint.per-file-ignores]
# Bootstraps: sys.path/stubs deben ir antes de los imports de modulo.
"tests/__init__.py" = ["E402"]
"tests/unit/test_debrid.py" = ["E402"]
"tests/unit/test_trakt.py" = ["E402"]
"scripts/record_e2e.py" = ["E402"]

[tool.pylint.main]
source-roots = "src"

[tool.pytest.ini_options]
pythonpath = "src"
testpaths = "tests"

[tool.coverage.run]
branch = true

[tool.coverage.report]
show_missing = true

[tool.mypy]
files = ["src/conflux"]
ignore_missing_imports = true
follow_imports = "skip"
warn_unused_ignores = true
check_untyped_defs = true

[tool.mutmut]
source_paths = ["src", "proxy.py", "tests"]
only_mutate = ["src/conflux/app/subs.py"]
pytest_add_cli_args_test_selection = ["tests/unit/test_subs.py"]
